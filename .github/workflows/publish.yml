name: Publish food catalog
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: food-catalog-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate catalogue
        run: |
          python tools/build_catalog.py
          python tools/validate_catalog.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish food catalogue revision"
            git push origin HEAD:main
          fi
          echo "DATA_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify immutable CDN download before announcing
        run: python tools/publish_manifest.py --commit "$DATA_COMMIT" --sequence "${{ github.run_number }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy version notification
        id: deployment
        uses: actions/deploy-pages@v5
