name: Publish Android app
on:
  push:
    branches: [main]
    paths: [publication/request.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-android-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify and publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_app.py
